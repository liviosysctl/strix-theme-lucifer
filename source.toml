# The recipe of this repository. tools/pack.py of StrixUI makes themes/ from it:
#   python3 ../strixui/tools/pack.py .
[[theme]]
id = "lucifer"
name = "Lucifer"
description = "Two colours: ember red for Lucifer, gold for the archangel above him."
accent = [0.50, 0.11, 25]
accent2 = [0.74, 0.10, 85]

[theme.plate]
source = "rijks:Tgakd:3200"
fit = [0.045, 0.035, 0.945, 0.855]
place = [1500, 0.96]
disc = [1695, 1190, 112]
discs2 = [[1490, 285, 95]]
paper = 0.55
vig = 0.7
caption = "The archangel Michael treads Lucifer down. Engraved by Pieter de Bailliu after Guido Reni"
credit = "Pieter de Bailliu (I) after Guido Reni, The Archangel Michael Tramples Satan, Rome, 1623 to 1660, published by Giovanni Battista de' Rossi. Rijksmuseum RP-P-BI-486, public domain"
licence = "public domain"
