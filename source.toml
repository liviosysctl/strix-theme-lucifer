# The recipe of this repository. strixui pack of strixui-v2 makes themes/ from it:
#   cargo run -rq --manifest-path ../strixui-v2/tools/Cargo.toml -- pack .
[[theme]]
id = "lucifer"
name = "Lucifer"
description = "Two colours: ember red for Lucifer, gold for the archangel above him."
accent = [0.50, 0.11, 25]
accent2 = [0.74, 0.10, 85]

[theme.plate]
source = "rijks:fKonn:3200"
crop = [0.03, 0.19, 0.955]
disc = [1829, 1224, 120]
discs2 = [[1411, 234, 112]]
caption = "The archangel Michael throws Lucifer and the rebel angels out of heaven. Engraved by Jacob Neefs after Peter Paul Rubens"
credit = "Jacob Neefs after Peter Paul Rubens, S. Michael, Antwerp, 1620 to 1680, published by Gilles Hendricx. Rijksmuseum RP-P-OB-23.930, public domain"
licence = "public domain"
